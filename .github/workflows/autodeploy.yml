name: Main branch testing & deploy

on:
  push:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Step 1 - Checkout master branch from GitHub
        uses: actions/checkout@v3

      - name: Step 2 - Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: x64
          cache: maven

      - name: Step 3 - Build with Maven
        run: mvn -B package --file pom.xml

      - name: Step 4 - Auto-deploy on Tomcat
        env:
          LOGIN: ${{ secrets.TOMCAT_LOGIN }}
          PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
          IP_ADDRESS: ${{ secrets.TOMCAT_IP_ADDRESS }}

        run: |
          cd target
          curl -T *.war "http://$LOGIN:$PASSWORD@$IP_ADDRESS/manager/text/deploy?&path=/reasa&update=true"